[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idem-replay"
version = "0.1.0"
description = "Decide whether an interrupted effectful call may be resent, or needs a human"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
idem-replay = "idem_replay.cli:main"

[tool.setuptools]
packages = ["idem_replay"]
